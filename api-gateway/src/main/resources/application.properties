spring.application.name=api-gateway

# Prefix every log line with the request's correlation id (see CorrelationIdFilter)
# and the current trace and span ids.
logging.pattern.correlation=[%X{correlationId:-}] [%X{traceId:-},%X{spanId:-}] 

# Outside Docker the transaction service owns port 8080, so the gateway listens
# on 8082 to avoid routing requests back to itself.
server.port=8082

spring.cloud.gateway.server.webmvc.routes[0].id=transaction-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8080
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/transfers/**

spring.cloud.gateway.server.webmvc.routes[1].id=accounts
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8080
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/accounts/**

spring.cloud.gateway.server.webmvc.routes[2].id=deposits
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8080
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/deposits/**

spring.cloud.gateway.server.webmvc.routes[3].id=stripe-webhooks
spring.cloud.gateway.server.webmvc.routes[3].uri=http://localhost:8080
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/webhooks/stripe

# Operator endpoints; the gateway and the service both require the ADMIN role.
spring.cloud.gateway.server.webmvc.routes[4].id=outbox-admin
spring.cloud.gateway.server.webmvc.routes[4].uri=http://localhost:8080
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/admin/outbox/**

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/finflow
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/finflow/protocol/openid-connect/certs

# Kubernetes probes (/actuator/health/liveness and /readiness), also outside
# Kubernetes so they can be tested.
management.endpoint.health.probes.enabled=true
