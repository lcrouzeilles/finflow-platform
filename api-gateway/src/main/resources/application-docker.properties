server.port=8080

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/finflow
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/finflow/protocol/openid-connect/certs

spring.cloud.gateway.server.webmvc.routes[0].id=transaction-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://transaction-service:8080
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/transfers/**

spring.cloud.gateway.server.webmvc.routes[1].id=accounts
spring.cloud.gateway.server.webmvc.routes[1].uri=http://transaction-service:8080
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/accounts/**

spring.cloud.gateway.server.webmvc.routes[2].id=deposits
spring.cloud.gateway.server.webmvc.routes[2].uri=http://transaction-service:8080
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/deposits/**

spring.cloud.gateway.server.webmvc.routes[3].id=stripe-webhooks
spring.cloud.gateway.server.webmvc.routes[3].uri=http://transaction-service:8080
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/webhooks/stripe

# Operator endpoints; the gateway and the service both require the ADMIN role.
spring.cloud.gateway.server.webmvc.routes[4].id=outbox-admin
spring.cloud.gateway.server.webmvc.routes[4].uri=http://transaction-service:8080
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/admin/outbox/**

# The gateway's port is public, so in containers the actuator (probes and
# /actuator/prometheus) listens on a separate port that is neither published
# by Docker Compose nor exposed by the Kubernetes Service.
management.server.port=9091

# JSON (ECS) log lines in containers, including the correlationId MDC field.
logging.structured.format.console=ecs

# Traces go to Tempo over OTLP/HTTP. Every request is sampled because this
# is a local stack; the default (10%) or less is the right call in production.
management.opentelemetry.tracing.export.otlp.endpoint=http://tempo:4318/v1/traces
management.tracing.sampling.probability=1.0
