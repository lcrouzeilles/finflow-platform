spring.application.name=transaction-service

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.cache.type=redis
spring.cache.redis.time-to-live=5m

spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s

management.health.redis.enabled=false
# Metrics (including resilience4j.circuitbreaker.* and resilience4j.retry.*
# for the Stripe client); /actuator/metrics still requires a JWT.
management.endpoints.web.exposure.include=health,metrics

finflow.outbox.poll-interval-ms=1000
# After this many failed publication attempts an outbox event is marked
# terminally failed (failed_at) and stops being retried.
finflow.outbox.max-attempts=10

# Stripe (test mode). Secrets come only from the environment; never put a
# key in this file. Redirect URLs are plain pages, there is no frontend.
finflow.payments.stripe.secret-key=${STRIPE_SECRET_KEY:}
finflow.payments.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
finflow.payments.stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:8080/deposits/success}
finflow.payments.stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:8080/deposits/cancel}
# SDK transport timeouts; the SDK defaults (30s/80s) are far too long.
finflow.payments.stripe.connect-timeout=3s
finflow.payments.stripe.read-timeout=10s
# Retry (exponential backoff, only on network/5xx/429/409 failures; the
# idempotency key makes retries safe) and circuit breaker around Stripe.
finflow.payments.stripe.resilience.max-attempts=3
finflow.payments.stripe.resilience.initial-wait=200ms
finflow.payments.stripe.resilience.sliding-window-size=10
finflow.payments.stripe.resilience.minimum-number-of-calls=5
finflow.payments.stripe.resilience.failure-rate-threshold=50
finflow.payments.stripe.resilience.wait-in-open=30s
finflow.payments.stripe.resilience.permitted-calls-in-half-open=2
# Deposit limits: currency whitelist and the smallest accepted amount
# (Stripe rejects card charges under USD 0.50).
finflow.payments.supported-currencies=USD
finflow.payments.minimum-amount=0.50
