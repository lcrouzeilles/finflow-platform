spring.application.name=transaction-service

# Prefix every log line with the request's correlation id (see CorrelationIdFilter)
# and the current trace and span ids.
logging.pattern.correlation=[%X{correlationId:-}] [%X{traceId:-},%X{spanId:-}] 

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.cache.type=redis
spring.cache.redis.time-to-live=5m

spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s

management.health.redis.enabled=false
# Metrics (including resilience4j.circuitbreaker.* and resilience4j.retry.*
# for the Stripe client); /actuator/metrics still requires a JWT.
# /actuator/prometheus is open for scrapers on the internal network: the
# gateway does not route /actuator/** and Docker does not publish this port.
management.endpoints.web.exposure.include=health,metrics,prometheus
# Histogram buckets so Prometheus can compute latency percentiles across
# instances (the p95 alert); client-side percentiles cannot be aggregated.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Kafka sends and listener invocations join the current trace; the
# traceparent travels as a record header.
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

# JDBC spans (datasource-micrometer): connection acquisition, so time spent
# waiting for a pooled connection is visible, and every query. Result-set
# fetches are left out as noise; parameter values are never recorded.
jdbc.includes=CONNECTION,QUERY
jdbc.datasource-proxy.include-parameter-values=false

finflow.outbox.poll-interval-ms=1000
# After this many failed publication attempts an outbox event is marked
# terminally failed (failed_at) and stops being retried.
finflow.outbox.max-attempts=10

# Stripe (test mode). Secrets come only from the environment; never put a
# key in this file. Redirect URLs are plain pages, there is no frontend.
finflow.payments.stripe.secret-key=${STRIPE_SECRET_KEY:}
finflow.payments.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
finflow.payments.stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:8080/deposits/success}
finflow.payments.stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:8080/deposits/cancel}
# Empty means the real Stripe API. perf/ points it at a simulated Stripe.
finflow.payments.stripe.api-base=${STRIPE_API_BASE:}
# SDK transport timeouts; the SDK defaults (30s/80s) are far too long.
finflow.payments.stripe.connect-timeout=3s
finflow.payments.stripe.read-timeout=10s
# Retry (exponential backoff, only on network/5xx/429/409 failures; the
# idempotency key makes retries safe) and circuit breaker around Stripe.
finflow.payments.stripe.resilience.max-attempts=3
finflow.payments.stripe.resilience.initial-wait=200ms
finflow.payments.stripe.resilience.sliding-window-size=10
finflow.payments.stripe.resilience.minimum-number-of-calls=5
finflow.payments.stripe.resilience.failure-rate-threshold=50
finflow.payments.stripe.resilience.wait-in-open=30s
finflow.payments.stripe.resilience.permitted-calls-in-half-open=2

# Reconciliation job (report only, never auto-corrects): compares Stripe
# Checkout Sessions with local deposits for [now - settle - lookback -
# overlap, now - settle] and records differences in
# reconciliation_discrepancies.
finflow.reconciliation.cron=0 0 3 * * *
finflow.reconciliation.lookback=PT48H
finflow.reconciliation.overlap=PT1H
finflow.reconciliation.settle=PT5M
# Deposit limits: currency whitelist and the smallest accepted amount
# (Stripe rejects card charges under USD 0.50).
finflow.payments.supported-currencies=USD
finflow.payments.minimum-amount=0.50

# Kubernetes probes (/actuator/health/liveness and /readiness), also outside
# Kubernetes so they can be tested. Readiness includes the database: without
# it no endpoint can work, so the pod leaves the Service instead of failing
# requests; liveness does not, so a database outage never restarts pods.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
