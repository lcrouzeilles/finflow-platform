server.port=8080

spring.datasource.url=jdbc:postgresql://postgres:5432/finflow
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/finflow
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/finflow/protocol/openid-connect/certs

spring.data.redis.host=redis
spring.data.redis.port=6379

spring.kafka.bootstrap-servers=kafka:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer