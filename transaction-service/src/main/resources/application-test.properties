spring.datasource.url=jdbc:postgresql://127.0.0.1:55433/finflow
spring.datasource.username=${DB_USERNAME:finflow}
spring.datasource.password=${DB_PASSWORD:finflow}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.kafka.listener.auto-startup=false
spring.kafka.consumer.group-id=finflow-transfer-consumer
spring.kafka.consumer.auto-offset-reset=earliest