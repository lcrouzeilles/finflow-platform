server.port=8080

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.url=jdbc:postgresql://127.0.0.1:55433/finflow
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/finflow
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/finflow/protocol/openid-connect/certs

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=finflow-transfer-consumer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=com.finflow.transaction_service.event.TransferCompletedEvent
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.finflow.transaction_service.event