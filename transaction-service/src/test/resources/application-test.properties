# Datasource and Redis connection details are provided at runtime by the
# Testcontainers containers declared in AbstractIntegrationTest
# (@ServiceConnection). Do not hardcode hosts or ports here.

spring.flyway.enabled=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.kafka.listener.auto-startup=false
spring.kafka.consumer.group-id=finflow-transfer-consumer
spring.kafka.consumer.auto-offset-reset=earliest

# Fixed signing secret so webhook tests can produce valid Stripe-Signature
# headers. It is not a real Stripe secret.
finflow.payments.stripe.webhook-secret=whsec_test_secret_for_signing_only
