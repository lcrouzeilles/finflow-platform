# Datasource and Redis connection details are provided at runtime by the
# Testcontainers containers declared in AbstractIntegrationTest
# (@ServiceConnection). Do not hardcode hosts or ports here.

spring.flyway.enabled=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.kafka.listener.auto-startup=false
spring.kafka.consumer.group-id=finflow-transfer-consumer
spring.kafka.consumer.auto-offset-reset=earliest
