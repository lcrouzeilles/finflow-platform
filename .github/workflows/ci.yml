name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  transaction-service:
    name: Transaction Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: transaction-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify
        run: ./mvnw --batch-mode verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: transaction-service-surefire-reports
          path: transaction-service/target/surefire-reports
          if-no-files-found: ignore

  api-gateway:
    name: API Gateway
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify
        run: ./mvnw --batch-mode verify

  kubernetes-manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Renders every overlay and validates the result against the
      # Kubernetes API schemas (no cluster needed).
      - name: Render and validate overlays
        run: |
          for overlay in k8s/overlays/*/; do
            echo "::group::$overlay"
            kubectl kustomize "$overlay" \
              | docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0 \
                  -strict -summary -kubernetes-version 1.33.0 -
            echo "::endgroup::"
          done

  observability:
    name: Prometheus config, alert rules and Alertmanager routes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check config and run alert rule tests
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/observability/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool \
            -v "$PWD/observability/prometheus:/rules:ro" -w /rules \
            prom/prometheus:v3.5.0 test rules alerts.test.yml
          # The cluster variant, with the shared rules where it mounts them.
          docker run --rm --entrypoint promtool \
            -v "$PWD/k8s/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/observability/prometheus:/etc/prometheus/rules:ro" \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint amtool             -v "$PWD/observability/alertmanager:/etc/alertmanager:ro"             prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml
          # Critical alerts page; everything else goes to the team channel.
          docker run --rm --entrypoint amtool             -v "$PWD/observability/alertmanager:/etc/alertmanager:ro"             prom/alertmanager:v0.28.1 config routes test             --config.file=/etc/alertmanager/alertmanager.yml --verify.receivers=on-call             alertname=OutboxNotDraining severity=critical
          docker run --rm --entrypoint amtool             -v "$PWD/observability/alertmanager:/etc/alertmanager:ro"             prom/alertmanager:v0.28.1 config routes test             --config.file=/etc/alertmanager/alertmanager.yml --verify.receivers=team-channel             alertname=HighLatency severity=warning
