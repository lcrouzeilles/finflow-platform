name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  transaction-service:
    name: Transaction Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: transaction-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify
        run: ./mvnw --batch-mode verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: transaction-service-surefire-reports
          path: transaction-service/target/surefire-reports
          if-no-files-found: ignore

  api-gateway:
    name: API Gateway
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify
        run: ./mvnw --batch-mode verify
