# Docker Desktop publishes LoadBalancer Services on localhost. Ports 8180
# and 8181 leave 8080/8081 to the Docker Compose stack, so both can run.
# The in-cluster Services keep port 8080 (the apps address keycloak:8080).
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-external
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 8180
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-external
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8181
      targetPort: http
